apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: messager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload
                operator: In
                values:
                - system
                - app
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: csi-s3-secret
              key: accessKeyID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: csi-s3-secret
              key: secretAccessKey
